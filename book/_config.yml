# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: Responsible Gen-AI for NASA Earthdata
author: eScience Institute, University of Washington
logo: logo.png
only_build_toc_files: true

parse:
  # https://jupyterbook.org/content/content-blocks.html?highlight=myst%20substitution#define-substitutions-for-your-whole-book
  # https://jupyterbook.org/content/content-blocks.html#using-substitutions-in-links
  myst_substitutions:
    hackweek: "Responsible Gen-AI for NASA Earthdata"
    dates: "August 24-28, 2026"
    github_org_url: "https://github.com/responsible-genai-hackweek"
    book_repo: "jupyterbook-template"
    website_url: "https://responsible-genai.hackweek.io/"
    jupyterhub_url: https://hub.cryointhecloud.com
    # Try permalink with correct image & higher resource allocation quay.io/cryointhecloud/cryo-python-ai:latest:
    # jupyterhub_url: "https://hub.cryointhecloud.com/hub/login?next=/hub/spawn%23fancy-forms-config=%7B%22profile%22%3A%22cpu-only%22%2C%22resource_allocation%22%3A%22mem_15_gb%22%2C%22resource_allocation%3Aunlisted_choice%22%3A%22%22%2C%22image%22%3A%22unlisted_choice%22%2C%22image%3Aunlisted_choice%22%3A%22quay.io%2Fcryointhecloud%2Fcryo-python-ai%3Alatest%22%7D"
    slack_workspace_url: "https://cryospherecloud.slack.com/archives/C0BD44RQA6R"
    contact_email: "escience-hackweeks@uw.edu"
    dataset: "INSERT_DATA_SET_NAME"
    anon_reporting_url: "https://INSERT_FORM_LINK"
    project_spreadsheet_url: "https://INSERT_GOOGLE_SHEET"
  myst_enable_extensions:
    # Defaults
    - dollarmath
    - linkify
    - substitution
    - colon_fence
    # Extras
    - html_image

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  # NOTE: 'cache' to use jupyter-cache, or 'force' to run all
  execute_notebooks: 'force'
  exclude_patterns:
    - "**/geospatial-advanced.ipynb"
  allow_errors: false
  # Per-cell notebook execution limit (seconds)
  timeout: 300

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Configure your Binder links, such as the URL of the BinderHub.
launch_buttons:
  notebook_interface: jupyterlab
  binderhub_url: "https://mybinder.org"

# Information about where the book exists on the web
repository:
  url: https://github.com/responsible-genai-hackweek/responsible-genai-hackweek # Online location of your book
  path_to_book: book  # Optional path to your book, relative to the repository root
  branch: main  # Which branch of the repository should be used when creating links (optional)

# Bibliography
bibtex_bibfiles:
  - references.bib
sphinx:
  config:
    bibtex_reference_style: author_year  # or label, super, \supercite
    nb_merge_streams: true # stdout lines combined in output
    nb_custom_formats:
        .py:
            - jupytext.reads
            - fmt: py:percent

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_edit_page_button: true
  use_issues_button: true
  use_repository_button: true
  # google_analytics_id: G-XXXXXXXXX
